version: '3.8'

services:
  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
    container_name: agenthub-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=libsql:file:/app/data/agenthub.db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=7d
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - agenthub-data:/app/data
    networks:
      - agenthub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Web Server (Nginx + Next.js static)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-production
    container_name: agenthub-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    networks:
      - agenthub-network
    depends_on:
      api:
        condition: service_healthy

networks:
  agenthub-network:
    driver: bridge

volumes:
  agenthub-data:
    driver: local
